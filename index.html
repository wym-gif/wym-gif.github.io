<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合集拼图工具</title><style>:root{--bg:#ebe4d8;--panel:#fffdf8;--text:#26231f;--muted:#746e65;--line:#d8d0c2;--accent:#1d8179;--soft:#e9f3f0;--danger:#a94438;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:360px 1fr}.side{background:var(--panel);border-right:1px solid var(--line);padding:20px;overflow:auto}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}h1{margin:0;font-size:24px}.count,.hint,label{color:var(--muted);font-size:13px}.drop{position:relative;display:grid;place-items:center;min-height:140px;padding:18px;border:2px dashed #b8ac9a;border-radius:8px;background:#fbf7ef;text-align:center;margin-bottom:18px}.drop.over{border-color:var(--accent);background:var(--soft)}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop b{display:block;margin-bottom:8px}.drop p{margin:0;line-height:1.5}.section{margin-top:18px}.section-title{font-weight:700;font-size:14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.section-title:after{content:"收起";font-weight:400;color:var(--muted);font-size:12px}.section.collapsed>:not(.section-title){display:none}.section.collapsed .section-title:after{content:"展开"}.field{display:grid;gap:7px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-bottom:12px}select,input[type=number],input[type=color]{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:7px 10px}input[type=range]{width:100%;accent-color:var(--accent)}input[type=text]{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:7px 10px}.mini-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.anno-active{color:var(--accent);font-weight:700}.thumbs{display:grid;gap:8px;max-height:330px;overflow:auto;padding-right:3px}.thumb{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.thumb img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#eee}.thumb.selected{border-color:var(--accent);background:var(--soft)}.name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.size{color:var(--muted);font-size:12px;margin-top:3px}.tools{display:flex;gap:5px}.icon{width:32px;min-height:32px;border-radius:8px;background:#eee7dc}.del{color:var(--danger)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{min-height:38px;border-radius:8px;background:#eee7dc;color:var(--text);padding:8px 11px}.primary{grid-column:1/-1;background:var(--accent);color:#fff}.stage{min-width:0;display:grid;grid-template-rows:auto 1fr;gap:16px;padding:22px}.preview{min-height:0;display:grid;place-items:center;overflow:auto;padding:18px;background:#e4dccf;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(38,35,31,.08)}canvas{max-width:min(100%,1200px);max-height:78vh;background:#fff;box-shadow:0 10px 28px rgba(38,35,31,.08);cursor:grab;touch-action:none}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.mode-tab{min-height:42px;border-radius:8px;background:#eee7dc;color:var(--text);font-weight:700}.mode-tab.active{background:var(--accent);color:#fff}.qr-panel{display:none}.qr-panel.show{display:block}.empty{width:min(680px,100%);padding:38px;border:1px dashed #b8ac9a;border-radius:8px;background:rgba(255,253,248,.7);text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:8px;color:var(--text);font-size:18px}.toast{position:fixed;right:18px;bottom:18px;max-width:320px;padding:12px 14px;border-radius:8px;background:#26231f;color:#fff;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;font-size:14px}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}canvas{max-height:68vh}}@media(max-width:520px){.side,.stage{padding:16px}.row,.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><aside class="side"><div class="brand"><h1>合集拼图工具</h1><span class="count" id="count">0 张图</span></div><div class="drop" id="drop"><input id="file" type="file" accept="image/*" multiple><div><b>点击或拖入图片</b><p>也可以复制图片后按 Ctrl+V 粘贴进来，只在本机处理。</p></div></div><div class="mode-tabs"><button class="mode-tab active" id="modeCollage" type="button">拼图模式</button><button class="mode-tab" id="modeEdit" type="button">P图模式</button></div><section class="section"><div class="section-title">功能</div><div class="field"><label for="layout">功能选择</label><select id="layout"><option value="six" data-mode="collage">六宫格正方形</option><option value="four" data-mode="collage">四宫格竖版</option><option value="poster" data-mode="collage">推荐合集海报</option><option value="auto" data-mode="collage">自动网格</option><option value="square" data-mode="collage">九宫格方图</option><option value="vertical" data-mode="collage">竖版长图</option><option value="horizontal" data-mode="collage">横版长图</option><option value="columns" data-mode="collage">固定列数</option><option value="stitchH" data-mode="collage">横向原图拼接</option><option value="stitchV" data-mode="collage">竖向原图拼接</option><option value="qr" data-mode="edit">二维码替换</option></select></div><div class="field"><label for="ratio">画布比例</label><select id="ratio"><option value="auto">按版式自动</option><option value="1:1">1:1 方图</option><option value="3:4">3:4 竖图</option><option value="4:5">4:5 商品图</option><option value="9:16">9:16 手机长图</option><option value="16:9">16:9 横图</option></select></div><div class="row"><label for="cols">列数</label><input id="cols" type="number" min="1" max="8" value="3"></div><div class="row"><label for="width">导出宽度</label><input id="width" type="number" min="200" max="4096" step="10" value="1080"></div></section><section class="section"><div class="section-title">细节</div><div class="field"><label for="gap">图片间距：<span id="gapText">20</span>px</label><input id="gap" type="range" min="0" max="100" value="20"></div><div class="field"><label for="pad">外边距：<span id="padText">30</span>px</label><input id="pad" type="range" min="0" max="160" value="30"></div><div class="row"><label for="radius">圆角</label><input id="radius" type="number" min="0" max="80" value="22"></div><div class="row"><label for="bg">背景色</label><input id="bg" type="color" value="#ffffff"></div><div class="field"><label for="fit">图片填充</label><select id="fit"><option value="cover">等比例铺满，轻微裁切</option><option value="contain">完整留白</option></select></div><div class="qr-panel" id="qrPanel"><div class="section-title">二维码替换</div><div class="field"><label for="qrScale">二维码大小：<span id="qrScaleText">80</span>%</label><input id="qrScale" type="range" min="35" max="160" value="80"></div><div class="field"><label for="qrOpacity">二维码透明度：<span id="qrOpacityText">100</span>%</label><input id="qrOpacity" type="range" min="0" max="100" value="100"></div><div class="field"><label for="qrX">左右位置：<span id="qrXText">0</span></label><input id="qrX" type="range" min="-220" max="220" value="0"></div><div class="field"><label for="qrY">上下位置：<span id="qrYText">0</span></label><input id="qrY" type="range" min="-360" max="360" value="0"></div><div class="row"><label for="badgeText">底部文字</label><input id="badgeText" type="text" placeholder="例如 12"></div><div class="field"><label for="badgeScale">文字大小：<span id="badgeScaleText">100</span>%</label><input id="badgeScale" type="range" min="60" max="160" value="100"></div><div class="field"><label for="badgeOpacity">文字透明度：<span id="badgeOpacityText">100</span>%</label><input id="badgeOpacity" type="range" min="0" max="100" value="100"></div><div class="field"><label for="badgeX">文字左右：<span id="badgeXText">0</span></label><input id="badgeX" type="range" min="-220" max="220" value="0"></div><div class="field"><label for="badgeY">文字上下：<span id="badgeYText">0</span></label><input id="badgeY" type="range" min="-220" max="220" value="0"></div></div><p class="hint">拼图模式用于多图排版；P图模式里，第1张放底图，第2张放新二维码图。</p></section><section class="section"><div class="section-title">单图调整</div><div class="field"><label id="selectedLabel">先点右侧预览图或下方小图</label></div><div class="field"><label for="itemZoom">单图放大：<span id="itemZoomText">100</span>%</label><input id="itemZoom" type="range" min="100" max="240" value="100"></div><button class="btn" id="resetItem" type="button">恢复这张图</button></section><section class="section" id="annoSection"><div class="section-title">标注</div><div class="field"><label id="annoTarget">先点右侧某张图片，再加标注</label></div><div class="mini-actions"><button class="btn" id="addText" type="button">加文字</button><button class="btn" id="addArrow" type="button">加箭头</button><button class="btn" id="addCircle" type="button">加圈圈</button><button class="btn" id="addCross" type="button">加叉号</button></div><div class="field" style="margin-top:12px"><label for="annoText">文字内容</label><input id="annoText" type="text" placeholder="例如 先领券"></div><div class="field"><label for="annoSize">标注大小：<span id="annoSizeText">48</span></label><input id="annoSize" type="range" min="16" max="180" value="48"></div><div class="row"><label for="annoColor">标注颜色</label><input id="annoColor" type="color" value="#18bff2"></div><div class="field"><label for="annoOpacity">标注透明度：<span id="annoOpacityText">100</span>%</label><input id="annoOpacity" type="range" min="0" max="100" value="100"></div><button class="btn" id="deleteAnno" type="button">删除当前标注</button></section><section class="section"><div class="section-title">图片顺序</div><div class="thumbs" id="thumbs"></div></section><div class="actions"><button class="btn primary" id="download" type="button">导出 PNG</button><button class="btn" id="clear" type="button">清空图片</button><button class="btn" id="sample" type="button">示例图</button></div></aside><section class="stage"><div class="hint" id="status">先添加图片，右侧会自动生成预览。</div><div class="preview"><div class="empty" id="empty"><strong id="emptyTitle">把图片放进来就能拼</strong><span id="emptyHint">支持宫格、长图、固定列数，也支持海报和原图拼接。</span></div><canvas id="canvas" hidden></canvas></div></section></main><div class="toast" id="toast"></div><script>const posterHeaderSrc='data:image/webp;base64,UklGRohSAABXRUJQVlA4IHxSAACwnQGdASqfA5EBPqlQokymJKOipNJrAMAVCWVu/8y9Dftqghzeljn+mGN/tLMc/yXAOf2/CPrp4r/W/yXprcj+NXzPT6/r97/wHk49T/+D1ff8r/we1Pxf/U9/3PYb+73rC/bz1U/N+9Gbqx6ct9Gf5//CeJv9u/zn9y/yHm3+Rfbv6n++ckiJ38t+/H7r/B+07+8/8PiT8x9Qj8d/n//A+4vi+QA/WP/uf4P8pvg0+x/8P999XPsd/yfcB/WH/l/37z0/Ee9U9gL+Zf2/9n/dz/xfLZ+k/7z2IP1834ArxAYgMQGIDEBiAxAYgMQGIDEBiAxAYgMQGIDEBiAxAYgMQGIDEBiAxAYgMQGIDEBiAxAYfoqWAwsh75F9M4djFuIDYhy6FHF9Rso2UbKNlGyjZRso2UbKNlGyjZRso2UbKNihIOsV0FDTDmqZrmmPNXJ0+8YZUkZ0kMyV/h/Q/of0P6H9D+h/Q/of0P6H9D+h/Q/of0P6H83zkubNP3/qXxDB5w1uVojt4jF96jnitSZgUURBxlNI40e2f7P9n+z/Z/s/2f7P9n/Xo4vqNlGyjZRso2Km676581VX+1NcUXrNteVFS9Cl81ukcb2B7aGFBtQGq4Uo3EfEPiHxD4h8Q+Ie/iEdme482LjyMJ86aqwQZtB7enOnkFlY22dmtDtQVk7JhF26FF5zlXkx3ivbuP4GaCxOkrvQArQrjKcQ3k496K9SMzyzM3WcBRxzfazHLrFw50fIpyHaq4qFPPZX7ri+inH/5hPoxJ3hcssJgnkDgkbwelGY2G7DkxaI5g27JzAzfLpyqZf6cH/aUkPhBNpgBSo2UbKNlGyjZRsoKgkmUlWqq8GL52md0g8QhfWHxvPuuCIludMEZfQfzzaOY2hd/8Yg+VL6/GbABSFOGR0qC7w/2gk17IY2XaltcLG3P4RyUZy44GPrcaKu5DtLuXQJWYBwUbPIZEw3rWPkb3/hmO8a/jlGgz+Oyow/EyVxxL0WtFryVKCovvLJ+sboN1FoP4BBKRnOvoQD4Bu5b1wi037WhccCUkfnrvwAFClWI5VqZXIh8Q+IfEPiHxDjnCH1DxbybbmjxcOw0ckTYpMmCO/Sn/yJAT9ZpKNZxslYMvURdSxW6R2Pig7iFaEUgShXoRdbvhYTimklMYLA1xYTCswaVAA4IDKnRrbhmckTJRgJgh60k9wVF7KTtpIi7KMaOf6RHIxhOMADpeEyZd9nTiHtQC2wJLowsIbMveKQjf3H/4nS0HUKga4FJqcHIpULndHlCBMZLly5KwgsYBa1Pty7fgLoK3SIySqiTM0uRD4h8Q+IfEPh6mI/faqAGVPQMhzsiPGw0
