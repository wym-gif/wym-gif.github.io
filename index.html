<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合集拼图工具</title><style>:root{--bg:#ebe4d8;--panel:#fffdf8;--text:#26231f;--muted:#746e65;--line:#d8d0c2;--accent:#1d8179;--soft:#e9f3f0;--danger:#a94438;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:356px 1fr}.side{background:var(--panel);border-right:1px solid var(--line);padding:20px;overflow:auto}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}h1{margin:0;font-size:24px;line-height:1.2}.count,.hint,label{color:var(--muted);font-size:13px}.drop{position:relative;display:grid;place-items:center;min-height:140px;padding:18px;border:2px dashed #b8ac9a;border-radius:8px;background:#fbf7ef;text-align:center;margin-bottom:18px}.drop.over{border-color:var(--accent);background:var(--soft)}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop b{display:block;margin-bottom:8px}.drop p{margin:0;line-height:1.5}.section{margin-top:18px}.section-title{font-weight:700;font-size:14px;margin-bottom:10px}.field{display:grid;gap:7px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-bottom:12px}select,input[type=number],input[type=color]{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:7px 10px}input[type=range]{width:100%;accent-color:var(--accent)}.thumbs{display:grid;gap:8px;max-height:330px;overflow:auto;padding-right:3px}.thumb{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.thumb img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#eee}.thumb.sel{border-color:var(--accent);background:var(--soft)}.name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.size{color:var(--muted);font-size:12px;margin-top:3px}.tools{display:flex;gap:5px}.icon{width:32px;min-height:32px;border-radius:8px;background:#eee7dc}.del{color:var(--danger)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{min-height:38px;border-radius:8px;background:#eee7dc;color:var(--text);padding:8px 11px}.primary{grid-column:1/-1;background:var(--accent);color:#fff}.stage{min-width:0;display:grid;grid-template-rows:auto 1fr;gap:16px;padding:22px}.preview{min-height:0;display:grid;place-items:center;overflow:auto;padding:18px;background:#e4dccf;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(38,35,31,.08)}canvas{max-width:min(100%,1200px);max-height:78vh;background:#fff;box-shadow:0 10px 28px rgba(38,35,31,.08)}.empty{width:min(680px,100%);padding:38px;border:1px dashed #b8ac9a;border-radius:8px;background:rgba(255,253,248,.7);text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:8px;color:var(--text);font-size:18px}.toast{position:fixed;right:18px;bottom:18px;max-width:320px;padding:12px 14px;border-radius:8px;background:#26231f;color:#fff;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;font-size:14px}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}canvas{max-height:68vh}}@media(max-width:520px){.side,.stage{padding:16px}.row,.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><aside class="side"><div class="brand"><h1>合集拼图工具</h1><span class="count" id="count">0 张图</span></div><div class="drop" id="drop"><input id="file" type="file" accept="image/*" multiple><div><b>点击或拖入图片</b><p>也可以复制图片后按 Ctrl+V 粘贴进来，只在本机处理。</p></div></div><section class="section"><div class="section-title">拼接</div><div class="field"><label for="mode">拼接方式</label><select id="mode"><option value="horizontal">横向原图拼接</option><option value="vertical">竖向原图拼接</option></select></div><div class="row"><label for="width">导出宽度</label><input id="width" type="number" min="200" max="4096" step="10" value="1080"></div></section><section class="section"><div class="section-title">细节</div><div class="field"><label for="gap">图片间距：<span id="gapText">0</span>px</label><input id="gap" type="range" min="0" max="100" value="0"></div><div class="field"><label for="pad">外边距：<span id="padText">0</span>px</label><input id="pad" type="range" min="0" max="160" value="0"></div><div class="row"><label for="bg">背景色</label><input id="bg" type="color" value="#ffffff"></div><p class="hint">不会裁切、不会拉伸。只会按原比例统一缩放到导出宽度。</p></section><section class="section"><div class="section-title">图片顺序</div><div class="thumbs" id="thumbs"></div></section><div class="actions"><button class="btn primary" id="download" type="button">导出 PNG</button><button class="btn" id="clear" type="button">清空图片</button><button class="btn" id="sample" type="button">示例图</button></div></aside><section class="stage"><div class="hint" id="status">先添加图片，右侧会自动生成预览。</div><div class="preview"><div class="empty" id="empty"><strong>把图片放进来就能拼</strong>横向或竖向直接接起来，保持每张图原本比例。</div><canvas id="canvas" hidden></canvas></div></section></main><div class="toast" id="toast"></div><script>const state={images:[],selected:null};const $=id=>document.getElementById(id);const els={file:$('file'),drop:$('drop'),count:$('count'),mode:$('mode'),width:$('width'),gap:$('gap'),gapText:$('gapText'),pad:$('pad'),padText:$('padText'),bg:$('bg'),thumbs:$('thumbs'),download:$('download'),clear:$('clear'),sample:$('sample'),status:$('status'),empty:$('empty'),canvas:$('canvas'),toast:$('toast')};const ctx=els.canvas.getContext('2d');const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));function show(text){els.toast.textContent=text;els.toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>els.toast.classList.remove('show'),2200)}function uid(){return Date.now()+'-'+Math.random().toString(16).slice(2)}function settings(){return{mode:els.mode.value,width:clamp(Number(els.width.value)||1080,200,4096),gap:Number(els.gap.value),pad:Number(els.pad.value),bg:els.bg.value}}function readImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>res({id:uid(),name:file.name||'image.png',src:r.result,img,width:img.naturalWidth,height:img.naturalHeight});img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}async function addFiles(files){const list=[...files].filter(f=>f.type&&f.type.startsWith('image/'));if(!list.length)return;try{const loaded=await Promise.all(list.map(readImage));state.images.push(...loaded);state.selected=state.selected||loaded[0]?.id||null;render();show('已添加 '+loaded.length+' 张图片')}catch(e){show('有图片读取失败，请换一张试试')}}function calc(s){const imgs=state.images;if(!imgs.length)return{w:s.width,h:s.width,scale:1};if(s.mode==='horizontal'){const innerW=Math.max(1,s.width-s.pad*2-s.gap*Math.max(0,imgs.length-1));const totalW=imgs.reduce((a,i)=>a+i.width,0);const scale=innerW/Math.max(1,totalW);const h=Math.max(...imgs.map(i=>i.height*scale))+s.pad*2;return{w:s.width,h:Math.round(h),scale}}const innerW=Math.max(1,s.width-s.pad*2);const maxW=Math.max(...imgs.map(i=>i.width),1);const scale=innerW/maxW;const h=imgs.reduce((a,i)=>a+i.height*scale,0)+s.gap*Math.max(0,imgs.length-1)+s.pad*2;return{w:s.width,h:Math.round(h),scale}}function draw(){const s=settings();els.gapText.textContent=s.gap;els.padText.textContent=s.pad;els.count.textContent=state.images.length+' 张图';els.canvas.hidden=!state.images.length;els.empty.hidden=!!state.images.length;if(!state.images.length){els.status.textContent='先添加图片，右侧会自动生成预览。';return}const c=calc(s);els.canvas.width=c.w;els.canvas.height=c.h;ctx.fillStyle=s.bg;ctx.fillRect(0,0,c.w,c.h);let x=s.pad,y=s.pad;state.images.forEach(item=>{const w=item.width*c.scale,h=item.height*c.scale;ctx.drawImage(item.img,x,y,w,h);if(s.mode==='horizontal')x+=w+s.gap;else y+=h+s.gap});els.status.textContent=c.w+' x '+c.h+'px，'+(s.mode==='horizontal'?'横向':'竖向')+'原图等比例拼接'}function renderThumbs(){els.thumbs.innerHTML='';state.images.forEach((item,i)=>{const row=document.createElement('div');row.className='thumb'+(item.id===state.selected?' sel':'');row.innerHTML='<img src="'+item.src+'" alt=""><div><div class="name">'+escapeHtml(item.name)+'</div><div class="size">'+item.width+' x '+item.height+'</div></div><div class="tools"><button class="icon" data-up>↑</button><button class="icon" data-down>↓</button><button class="icon del" data-del>×</button></div>';row.onclick=e=>{if(e.target.closest('button'))return;state.selected=item.id;renderThumbs()};row.querySelector('[data-up]').onclick=()=>move(i,-1);row.querySelector('[data-down]').onclick=()=>move(i,1);row.querySelector('[data-del]').onclick=()=>{state.images=state.images.filter(x=>x.id!==item.id);if(state.selected===item.id)state.selected=state.images[0]?.id||null;render()};els.thumbs.appendChild(row)})}function move(i,d){const j=i+d;if(j<0||j>=state.images.length)return;[state.images[i],state.images[j]]=[state.images[j],state.images[i]];render()}function render(){renderThumbs();draw()}function escapeHtml(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function download(){if(!state.images.length){show('请先添加图片');return}const a=document.createElement('a');const stamp=new Date().toISOString().slice(0,19).replace(/[-:T]/g,'');a.download='原图拼接-'+stamp+'.png';a.href=els.canvas.toDataURL('image/png');a.click()}function sampleImg(label,w,h,a,b){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const grad=g.createLinearGradient(0,0,w,h);grad.addColorStop(0,a);grad.addColorStop(1,b);g.fillStyle=grad;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.86)';g.fillRect(w*.12,h*.42,w*.76,h*.16);g.fillStyle='#26231f';g.font='700 '+Math.round(w*.09)+'px Microsoft YaHei,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(label,w/2,h/2);const img=new Image();return new Promise(r=>{img.onload=()=>r({id:uid(),name:label+'.png',src:c.toDataURL('image/png'),img,width:w,height:h});img.src=c.toDataURL('image/png')})}async function samples(){if(state.images.length){show('已有图片时不会载入示例，避免覆盖你的图片');return}state.images=await Promise.all([sampleImg('第一张',750,1140,'#dff3ff','#8bb8df'),sampleImg('第二张',750,1140,'#fff5e5','#dfb18b')]);state.selected=state.images[0].id;render();show('已载入示例图')}els.file.onchange=e=>{addFiles(e.target.files);e.target.value=''};['dragenter','dragover'].forEach(t=>els.drop.addEventListener(t,e=>{e.preventDefault();els.drop.classList.add('over')}));['dragleave','drop'].forEach(t=>els.drop.addEventListener(t,e=>{e.preventDefault();els.drop.classList.remove('over')}));els.drop.ondrop=e=>addFiles(e.dataTransfer.files);document.addEventListener('paste',e=>{const files=[...(e.clipboardData?.files||[])];const items=[...(e.clipboardData?.items||[])].filter(i=>i.kind==='file'&&i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);const imgs=files.length?files:items;if(imgs.length){e.preventDefault();addFiles(imgs)}});[els.mode,els.width,els.gap,els.pad,els.bg].forEach(el=>el.addEventListener('input',draw));els.download.onclick=download;els.clear.onclick=()=>{if(!state.images.length){show('现在没有图片需要清空');return}if(confirm('确定清空当前图片吗？')){state.images=[];state.selected=null;render();show('已清空')}};els.sample.onclick=samples;render();</script></body></html>
