<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合集拼图工具</title><style>:root{--bg:#ebe4d8;--panel:#fffdf8;--text:#26231f;--muted:#746e65;--line:#d8d0c2;--accent:#1d8179;--soft:#e9f3f0;--danger:#a94438;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:360px 1fr}.side{background:var(--panel);border-right:1px solid var(--line);padding:20px;overflow:auto}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}h1{margin:0;font-size:24px}.count,.hint,label{color:var(--muted);font-size:13px}.drop{position:relative;display:grid;place-items:center;min-height:140px;padding:18px;border:2px dashed #b8ac9a;border-radius:8px;background:#fbf7ef;text-align:center;margin-bottom:18px}.drop.over{border-color:var(--accent);background:var(--soft)}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop b{display:block;margin-bottom:8px}.drop p{margin:0;line-height:1.5}.section{margin-top:18px}.section-title{font-weight:700;font-size:14px;margin-bottom:10px}.field{display:grid;gap:7px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-bottom:12px}select,input[type=number],input[type=color]{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:7px 10px}input[type=range]{width:100%;accent-color:var(--accent)}.thumbs{display:grid;gap:8px;max-height:330px;overflow:auto;padding-right:3px}.thumb{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.thumb img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#eee}.name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.size{color:var(--muted);font-size:12px;margin-top:3px}.tools{display:flex;gap:5px}.icon{width:32px;min-height:32px;border-radius:8px;background:#eee7dc}.del{color:var(--danger)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{min-height:38px;border-radius:8px;background:#eee7dc;color:var(--text);padding:8px 11px}.primary{grid-column:1/-1;background:var(--accent);color:#fff}.stage{min-width:0;display:grid;grid-template-rows:auto 1fr;gap:16px;padding:22px}.preview{min-height:0;display:grid;place-items:center;overflow:auto;padding:18px;background:#e4dccf;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(38,35,31,.08)}canvas{max-width:min(100%,1200px);max-height:78vh;background:#fff;box-shadow:0 10px 28px rgba(38,35,31,.08)}.empty{width:min(680px,100%);padding:38px;border:1px dashed #b8ac9a;border-radius:8px;background:rgba(255,253,248,.7);text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:8px;color:var(--text);font-size:18px}.toast{position:fixed;right:18px;bottom:18px;max-width:320px;padding:12px 14px;border-radius:8px;background:#26231f;color:#fff;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;font-size:14px}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}canvas{max-height:68vh}}@media(max-width:520px){.side,.stage{padding:16px}.row,.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><aside class="side"><div class="brand"><h1>合集拼图工具</h1><span class="count" id="count">0 张图</span></div><div class="drop" id="drop"><input id="file" type="file" accept="image/*" multiple><div><b>点击或拖入图片</b><p>也可以复制图片后按 Ctrl+V 粘贴进来，只在本机处理。</p></div></div><section class="section"><div class="section-title">版式</div><div class="field"><label for="layout">拼图方式</label><select id="layout"><option value="six">六宫格正方形</option><option value="four">四宫格竖版</option><option value="poster">推荐合集海报</option><option value="auto">自动网格</option><option value="square">九宫格方图</option><option value="vertical">竖版长图</option><option value="horizontal">横版长图</option><option value="columns">固定列数</option><option value="stitchH">横向原图拼接</option><option value="stitchV">竖向原图拼接</option></select></div><div class="field"><label for="ratio">画布比例</label><select id="ratio"><option value="auto">按版式自动</option><option value="1:1">1:1 方图</option><option value="3:4">3:4 竖图</option><option value="4:5">4:5 商品图</option><option value="9:16">9:16 手机长图</option><option value="16:9">16:9 横图</option></select></div><div class="row"><label for="cols">列数</label><input id="cols" type="number" min="1" max="8" value="3"></div><div class="row"><label for="width">导出宽度</label><input id="width" type="number" min="200" max="4096" step="10" value="1080"></div></section><section class="section"><div class="section-title">细节</div><div class="field"><label for="gap">图片间距：<span id="gapText">20</span>px</label><input id="gap" type="range" min="0" max="100" value="20"></div><div class="field"><label for="pad">外边距：<span id="padText">30</span>px</label><input id="pad" type="range" min="0" max="160" value="30"></div><div class="row"><label for="radius">圆角</label><input id="radius" type="number" min="0" max="80" value="22"></div><div class="row"><label for="bg">背景色</label><input id="bg" type="color" value="#ffffff"></div><div class="field"><label for="fit">图片填充</label><select id="fit"><option value="cover">等比例铺满，轻微裁切</option><option value="contain">完整留白</option></select></div><p class="hint">原图拼接模式不会裁切、不会拉伸；海报模式会用固定顶部横幅。</p></section><section class="section"><div class="section-title">图片顺序</div><div class="thumbs" id="thumbs"></div></section><div class="actions"><button class="btn primary" id="download" type="button">导出 PNG</button><button class="btn" id="clear" type="button">清空图片</button><button class="btn" id="sample" type="button">示例图</button></div></aside><section class="stage"><div class="hint" id="status">先添加图片，右侧会自动生成预览。</div><div class="preview"><div class="empty" id="empty"><strong>把图片放进来就能拼</strong>支持宫格、长图、固定列数，也支持海报和原图拼接。</div><canvas id="canvas" hidden></canvas></div></section></main><div class="toast" id="toast"></div><script>const posterHeaderSrc='data:image/webp;base64,UklGRjYqAABXRUJQVlA4ICoqAAAQ4wCdASpsAgwBPv12s1KrJyUip3KLSWAfiWNu+Exb08XeNnDkMO8cyH66efPz/P55R8f5EmKf2Dnn2N/S9uGv7F6Lv2z9YD0//8bftPRA6bf/GZHB6X/2Xbv/wv7r3n/uP91xoIpvzb8Lf1v7z6g/9LxL4B35R+ut8ruP6BHvN9i8y/6fzT+wnsB/mv5UPiIew+wJ/Mv8b6Q+j37D9h4wkQLxSo90sUqPdLFKj3SZi3cv0EZdL1FEvnTvIwUlwSsVFO62s8SIg3Q8xwTEyCVsl4gwEm7/G14UYnSKN/2W7UhKHKoAqt36p7AvFKj3SxSo90sUqPdJOLtR2Vw9ijdrR0nlp991iKUeK1nEE8Hp7bClR7pYpUe6RAR0Z9hz/8kKF45sW3Gwz0ft7wPeR9ydPMBC/FMwylQ1YPQZO4UFzwGDicd5fXtz1oqF0i7+HVrZzZeUMKugMzBT/nNS2qCe7zVqZS+KjV4nzCl3CbP3aJZFR7pYpUe6WJxADvMLfiinT1Y2trxhuLdZFt28GhXK96AIZe5ffIpzyfIKLguK3nBUi0ina6/ASnSPWkldtzu44/wC2oTmIOXv8jHcjL6n4ORFODW/gGzU/VET22SS3XMFb0d9pwykPCkqouLUoifqt/r2//57qJe5FLJiNm0FmxYh6IBSSa2dhLQ081NrNomBmzaHI7ZustQtjPppwrhsSEan7saVOEAgyY4JoLeGJKYSd1GfpQEtZ8v8Racx45FJRIJLZiPSw+34j1LpHl79okrD9ni8S7DY143vyPmDI1T8LDKOkPOSjnqtMwjfad/9WgGKnTHkNFtyKFcuQ2ZOF+StV99z4NESX+r5pOfwIGxL00HdilR7pYmzVcBoHM0GrKe6Uf64VlZ8ASN84BmBcyna6kp4TH5gri9TiRNG+3Y8yKEWfor6Oun6i5rnSvj1frTtiymXs32E+5EBFSUqKXK0QtvTxycJqA5HEmZjdSyjXw1W5S52E3nauoP2boXo3W1m0TAzZtGEO3W8flPCF143qM6mPQcWJTJzaQCRzye9+nKgzn3vZKLJR+RwgTn58cQiSuKPdLFKj3SxSo90sUqPdLFJxB+0dpCJO4pSJS5MjaD0XUrjLxNN4v/09dy2ghgZop3W1m0S22P0sqhHADAu905cvA0SOIb1UVWRhBo2gETAC6CeEMA0QgCuvis6/58Oaa7JgnV3wAsq6xAW9jkFOy+Qqp5Pi5BXU/hKOq85OUB3JONyslRMDNmTPk6EQv6Yb2EU/HjyJ3sjAM+phKyFZTkmIKbINlBqp8YMeiEML6dCYexHfFbH+ftmEZlotyGDV2TqPr61oshTixmBSFS9yPoHtMCGi65sWUrKJgSPmIGzftRPVno386aXa86l0qt3+1Mvf06RNfPX4W5cU3a+xel7/bMfE0NKBgIrL4s68yVvqwyn+fie+g5Jx+9EbO7rwAswcwI8cLVgpZmdWOJXB240q3//pymkYpuQdm5SA/4gy8O+CSvMHISrSjXz15+cKLO9lIXI78kMFRK3Pk83LGTwfSs1EEf8f5TrGurL+wz2wCK5l9c8N2KxkJM8c6ukZ5896DYg chH'||st.layout==='stitchV'){const sz=stitchSize(st);els.canvas.width=sz.w;els.canvas.height=sz.h;ctx.fillStyle=st.bg;ctx.fillRect(0,0,sz.w,sz.h);let x=st.pad,y=st.pad;state.images.forEach(it=>{const w=it.width*sz.scale,h=it.height*sz.scale;ctx.drawImage(it.img,x,y,w,h);if(st.layout==='stitchH')x+=w+st.gap;else y+=h+st.gap});els.status.textContent=sz.w+' x '+sz.h+'px，'+(st.layout==='stitchH'?'横向':'竖向')+'原图等比例拼接';return}const g=grid(st,state.images.length),sz=size(st,g);els.canvas.width=sz.w;els.canvas.height=sz.h;ctx.fillStyle=st.bg;ctx.fillRect(0,0,sz.w,sz.h);let top=st.pad;if(g.poster){const hh=drawPosterHeader(st,sz,sz.w-st.pad*2);top=st.pad+hh+st.gap}const iw=sz.w-st.pad*2,ih=sz.h-top-st.pad,cw=(iw-st.gap*(g.c-1))/g.c,ch=(ih-st.gap*(g.r-1))/g.r;state.images.forEach((it,i)=>{if(g.limit&&i>=g.limit)return;const col=i%g.c,row=Math.floor(i/g.c);if(row>=g.r)return;drawImg(it,st.pad+col*(cw+st.gap),top+row*(ch+st.gap),cw,ch,st)});els.status.textContent=sz.w+' x '+sz.h+'px，'+g.c+' 列 x '+g.r+' 行'+(g.need&&state.images.length!==g.need?'，建议 '+g.need+' 张':'')}function renderThumbs(){els.thumbs.innerHTML='';state.images.forEach((item,i)=>{const row=document.createElement('div');row.className='thumb';row.innerHTML='<img src="'+item.src+'"><div><div class="name">'+esc(item.name)+'</div><div class="size">'+item.width+' x '+item.height+'</div></div><div class="tools"><button class="icon" data-up>↑</button><button class="icon" data-down>↓</button><button class="icon del" data-del>×</button></div>';row.querySelector('[data-up]').onclick=()=>move(i,-1);row.querySelector('[data-down]').onclick=()=>move(i,1);row.querySelector('[data-del]').onclick=()=>{state.images.splice(i,1);render()};els.thumbs.appendChild(row)})}function move(i,d){const j=i+d;if(j<0||j>=state.images.length)return;[state.images[i],state.images[j]]=[state.images[j],state.images[i]];render()}function render(){renderThumbs();draw()}function esc(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function download(){if(!state.images.length)return show('请先添加图片');const a=document.createElement('a');a.download='合集拼图-'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+'.png';a.href=els.canvas.toDataURL('image/png');a.click()}function sample(label,w,h,a,b){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),grad=g.createLinearGradient(0,0,w,h);grad.addColorStop(0,a);grad.addColorStop(1,b);g.fillStyle=grad;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.86)';g.fillRect(w*.12,h*.42,w*.76,h*.16);g.fillStyle='#26231f';g.font='700 '+Math.round(w*.08)+'px Microsoft YaHei';g.textAlign='center';g.textBaseline='middle';g.fillText(label,w/2,h/2);const img=new Image();return new Promise(r=>{img.onload=()=>r({id:uid(),name:label+'.png',src:c.toDataURL(),img,width:w,height:h});img.src=c.toDataURL()})}async function samples(){if(state.images.length)return show('已有图片时不会载入示例');state.images=await Promise.all([sample('第一张',750,1140,'#dff3ff','#8bb8df'),sample('第二张',750,1140,'#fff5e5','#dfb18b'),sample('第三张',900,900,'#e8f5df','#80b38b'),sample('第四张',900,900,'#ffe4e1','#d99a9a'),sample('第五张',900,900,'#fff3d8','#d9b56e'),sample('第六张',900,900,'#eee2ff','#9f8bd9')]);render()}els.file.onchange=e=>{addFiles(e.target.files);e.target.value=''};['dragenter','dragover'].forEach(t=>els.drop.addEventListener(t,e=>{e.preventDefault();els.drop.classList.add('over')}));['dragleave','drop'].forEach(t=>els.drop.addEventListener(t,e=>{e.preventDefault();els.drop.classList.remove('over')}));els.drop.ondrop=e=>addFiles(e.dataTransfer.files);document.addEventListener('paste',e=>{const files=[...(e.clipboardData?.files||[])];const items=[...(e.clipboardData?.items||[])].filter(i=>i.kind==='file'&&i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);const imgs=files.length?files:items;if(imgs.length){e.preventDefault();addFiles(imgs)}});[els.layout,els.ratio,els.cols,els.width,els.gap,els.pad,els.radius,els.bg,els.fit].forEach(el=>el.addEventListener('input',e=>{if(e.target===els.layout)setPreset();draw()}));els.download.onclick=download;els.clear.onclick=()=>{if(!state.images.length)return show('现在没有图片需要清空');if(confirm('确定清空当前图片吗？')){state.images=[];render();show('已清空')}};els.sample.onclick=samples;setPreset();render();</script></body></html>
