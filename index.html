<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合集拼图工具</title><style>:root{--bg:#ebe4d8;--panel:#fffdf8;--text:#26231f;--muted:#746e65;--line:#d8d0c2;--accent:#1d8179;--soft:#e9f3f0;--danger:#a94438;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:360px 1fr}.side{background:var(--panel);border-right:1px solid var(--line);padding:20px;overflow:auto}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}h1{margin:0;font-size:24px}.count,.hint,label{color:var(--muted);font-size:13px}.drop{position:relative;display:grid;place-items:center;min-height:140px;padding:18px;border:2px dashed #b8ac9a;border-radius:8px;background:#fbf7ef;text-align:center;margin-bottom:18px}.drop.over{border-color:var(--accent);background:var(--soft)}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop b{display:block;margin-bottom:8px}.drop p{margin:0;line-height:1.5}.section{margin-top:18px}.section-title{font-weight:700;font-size:14px;margin-bottom:10px}.field{display:grid;gap:7px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-bottom:12px}select,input[type=number],input[type=color]{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:7px 10px}input[type=range]{width:100%;accent-color:var(--accent)}.thumbs{display:grid;gap:8px;max-height:330px;overflow:auto;padding-right:3px}.thumb{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.thumb img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#eee}.name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.size{color:var(--muted);font-size:12px;margin-top:3px}.tools{display:flex;gap:5px}.icon{width:32px;min-height:32px;border-radius:8px;background:#eee7dc}.del{color:var(--danger)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{min-height:38px;border-radius:8px;background:#eee7dc;color:var(--text);padding:8px 11px}.primary{grid-column:1/-1;background:var(--accent);color:#fff}.stage{min-width:0;display:grid;grid-template-rows:auto 1fr;gap:16px;padding:22px}.preview{min-height:0;display:grid;place-items:center;overflow:auto;padding:18px;background:#e4dccf;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(38,35,31,.08)}canvas{max-width:min(100%,1200px);max-height:78vh;background:#fff;box-shadow:0 10px 28px rgba(38,35,31,.08)}.empty{width:min(680px,100%);padding:38px;border:1px dashed #b8ac9a;border-radius:8px;background:rgba(255,253,248,.7);text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:8px;color:var(--text);font-size:18px}.toast{position:fixed;right:18px;bottom:18px;max-width:320px;padding:12px 14px;border-radius:8px;background:#26231f;color:#fff;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;font-size:14px}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}canvas{max-height:68vh}}@media(max-width:520px){.side,.stage{padding:16px}.row,.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><aside class="side"><div class="brand"><h1>合集拼图工具</h1><span class="count" id="count">0 张图</span></div><div class="drop" id="drop"><input id="file" type="file" accept="image/*" multiple><div><b>点击或拖入图片</b><p>也可以复制图片后按 Ctrl+V 粘贴进来，只在本机处理。</p></div></div><section class="section"><div class="section-title">版式</div><div class="field"><label for="layout">拼图方式</label><select id="layout"><option value="six">六宫格正方形</option><option value="four">四宫格竖版</option><option value="poster">推荐合集海报</option><option value="auto">自动网格</option><option value="square">九宫格方图</option><option value="vertical">竖版长图</option><option value="horizontal">横版长图</option><option value="columns">固定列数</option><option value="stitchH">横向原图拼接</option><option value="stitchV">竖向原图拼接</option></select></div><div class="field"><label for="ratio">画布比例</label><select id="ratio"><option value="auto">按版式自动</option><option value="1:1">1:1 方图</option><option value="3:4">3:4 竖图</option><option value="4:5">4:5 商品图</option><option value="9:16">9:16 手机长图</option><option value="16:9">16:9 横图</option></select></div><div class="row"><label for="cols">列数</label><input id="cols" type="number" min="1" max="8" value="3"></div><div class="row"><label for="width">导出宽度</label><input id="width" type="number" min="200" max="4096" step="10" value="1080"></div></section><section class="section"><div class="section-title">细节</div><div class="field"><label for="gap">图片间距：<span id="gapText">20</span>px</label><input id="gap" type="range" min="0" max="100" value="20"></div><div class="field"><label for="pad">外边距：<span id="padText">30</span>px</label><input id="pad" type="range" min="0" max="160" value="30"></div><div class="row"><label for="radius">圆角</label><input id="radius" type="number" min="0" max="80" value="22"></div><div class="row"><label for="bg">背景色</label><input id="bg" type="color" value="#ffffff"></div><div class="field"><label for="fit">图片填充</label><select id="fit"><option value="cover">等比例铺满，轻微裁切</option><option value="contain">完整留白</option></select></div><p class="hint">原图拼接模式不会裁切、不会拉伸；其它宫格模式按格子排版。</p></section><section class="section"><div class="section-title">图片顺序</div><div class="thumbs" id="thumbs"></div></section><div class="actions"><button class="btn primary" id="download" type="button">导出 PNG</button><button class="btn" id="clear" type="button">清空图片</button><button class="btn" id="sample" type="button">示例图</button></div></aside><section class="stage"><div class="hint" id="status">先添加图片，右侧会自动生成预览。</div><div class="preview"><div class="empty" id="empty"><strong>把图片放进来就能拼</strong>支持宫格、长图、固定列数，也支持横向/竖向原图拼接。</div><canvas id="canvas" hidden></canvas></div></section></main><div class="toast" id="toast"></div><script>const state={images:[]};const $=id=>document.getElementById(id);const els={file:$('file'),drop:$('drop'),count:$('count'),layout:$('layout'),ratio:$('ratio'),cols:$('cols'),width:$('width'),gap:$('gap'),gapText:$('gapText'),pad:$('pad'),padText:$('padText'),radius:$('radius'),bg:$('bg'),fit:$('fit'),thumbs:$('thumbs'),download:$('download'),clear:$('clear'),sample:$('sample'),status:$('status'),empty:$('empty'),canvas:$('canvas'),toast:$('toast')};const ctx=els.canvas.getContext('2d');const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));function show(t){els.toast.textContent=t;els.toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>els.toast.classList.remove('show'),2200)}function uid(){return Date.now()+'-'+Math.random().toString(16).slice(2)}function setPreset(){const p={six:['1:1',3,20,30,22,'cover'],four:['3:4',2,12,20,26,'cover'],poster:['4:5',3,8,10,18,'cover'],stitchH:['auto',1,0,0,0,'contain'],stitchV:['auto',1,0,0,0,'contain']}[els.layout.value];if(p){els.ratio.value=p[0];els.cols.value=p[1];els.gap.value=p[2];els.pad.value=p[3];els.radius.value=p[4];els.fit.value=p[5]}}function s(){return{layout:els.layout.value,ratio:els.ratio.value,cols:clamp(+els.cols.value||3,1,8),w:clamp(+els.width.value||1080,200,4096),gap:+els.gap.value,pad:+els.pad.value,r:clamp(+els.radius.value||0,0,80),bg:els.bg.value,fit:els.fit.value}}function readImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>res({id:uid(),name:file.name||'image.png',src:r.result,img,width:img.naturalWidth,height:img.naturalHeight});img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}async function addFiles(files){const list=[...files].filter(f=>f.type&&f.type.startsWith('image/'));if(!list.length)return;try{state.images.push(...await Promise.all(list.map(readImage)));render();show('已添加 '+list.length+' 张图片')}catch(e){show('有图片读取失败')}}function grid(st,count){if(st.layout==='six')return{c:3,r:2,limit:6,need:6};if(st.layout==='four')return{c:2,r:2,limit:4,need:4};if(st.layout==='poster')return{c:3,r:2,limit:6,need:6,poster:true};if(st.layout==='vertical')return{c:1,r:count};if(st.layout==='horizontal')return{c:count,r:1};if(st.layout==='columns')return{c:Math.min(st.cols,Math.max(count,1)),r:Math.ceil(count/Math.max(1,Math.min(st.cols,count||1)))};if(st.layout==='square'){const c=Math.ceil(Math.sqrt(count||1));return{c,r:c}}const c=Math.ceil(Math.sqrt(count||1));return{c,r:Math.ceil((count||1)/c)}}function size(st,g){if(st.layout==='stitchH'||st.layout==='stitchV')return stitchSize(st);let ratio=null;if(st.ratio!=='auto'){const a=st.ratio.split(':').map(Number);ratio=a[1]/a[0]}if(ratio)return{w:st.w,h:Math.round(st.w*ratio)};if(st.layout==='vertical'){const cw=st.w-st.pad*2,avg=state.images.length?state.images.reduce((a,i)=>a+i.height/i.width,0)/state.images.length:1;return{w:st.w,h:Math.round(st.pad*2+state.images.length*cw*clamp(avg,.6,1.8)+st.gap*Math.max(0,state.images.length-1))}}if(st.layout==='horizontal')return{w:st.w,h:Math.round(st.w/Math.max(g.c,1)+st.pad*2)}return{w:st.w,h:st.w}}function stitchSize(st){const imgs=state.images;if(!imgs.length)return{w:st.w,h:st.w,scale:1};if(st.layout==='stitchH'){const inner=Math.max(1,st.w-st.pad*2-st.gap*Math.max(0,imgs.length-1));const scale=inner/Math.max(1,imgs.reduce((a,i)=>a+i.width,0));return{w:st.w,h:Math.round(Math.max(...imgs.map(i=>i.height*scale))+st.pad*2),scale}}const inner=Math.max(1,st.w-st.pad*2);const scale=inner/Math.max(...imgs.map(i=>i.width),1);return{w:st.w,h:Math.round(imgs.reduce((a,i)=>a+i.height*scale,0)+st.gap*Math.max(0,imgs.length-1)+st.pad*2),scale}}function round(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function drawImg(item,x,y,w,h,st){let dx=x,dy=y,dw=w,dh=h;const ir=item.width/item.height,br=w/h;if(st.fit==='cover'){const sc=Math.max(w/item.width,h/item.height);dw=item.width*sc;dh=item.height*sc;dx=x+(w-dw)/2;dy=y+(h-dh)/2}else if(ir>br){dh=w/ir;dy=y+(h-dh)/2}else{dw=h*ir;dx=x+(w-dw)/2}ctx.save();round(x,y,w,h,st.r);ctx.clip();ctx.fillStyle='#f3f0ea';ctx.fillRect(x,y,w,h);ctx.drawImage(item.img,dx,dy,dw,dh);ctx.restore()}function draw(){const st=s();els.gapText.textContent=st.gap;els.padText.textContent=st.pad;els.count.textContent=state.images.length+' 张图';els.canvas.hidden=!state.images.length;els.empty.hidden=!!state.images.length;if(!state.images.length){els.status.textContent='先添加图片，右侧会自动生成预览。';return}if(st.layout==='stitchH'||st.layout==='stitchV'){const sz=stitchSize(st);els.canvas.width=sz.w;els.canvas.height=sz.h;ctx.fillStyle=st.bg;ctx.fillRect(0,0,sz.w,sz.h);let x=st.pad,y=st.pad;state.images.forEach(it=>{const w=it.width*sz.scale,h=it.height*sz.scale;ctx.drawImage(it.img,x,y,w,h);if(st.layout==='stitchH')x+=w+st.gap;else y+=h+st.gap});els.status.textContent=sz.w+' x '+sz.h+'px，'+(st.layout==='stitchH'?'横向':'竖向')+'原图等比例拼接';return}const g=grid(st,state.images.length),sz=size(st,g);els.canvas.width=sz.w;els.canvas.height=sz.h;ctx.fillStyle=st.bg;ctx.fillRect(0,0,sz.w,sz.h);let top=st.pad;if(g.poster){const hh=Math.round((sz.w-st.pad*2)*.28);ctx.fillStyle='#f7a477';round(st.pad,st.pad,sz.w-st.pad*2,hh,24);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 '+Math.round(hh*.28)+'px Microsoft YaHei';ctx.textAlign='center';ctx.strokeStyle='#222';ctx.lineWidth=Math.max(8,hh*.06);ctx.strokeText('豆妈好物合集',sz.w/2,st.pad+hh*.62);ctx.fillText('豆妈好物合集',sz.w/2,st.pad+hh*.62);top=st.pad+hh+st.gap}const iw=sz.w-st.pad*2,ih=sz.h-top-st.pad,cw=(iw-st.gap*(g.c-1))/g.c,ch=(ih-st.gap*(g.r-1))/g.r;state.images.forEach((it,i)=>{if(g.limit&&i>=g.limit)return;const col=i%g.c,row=Math.floor(i/g.c);if(row>=g.r)return;drawImg(it,st.pad+col*(cw+st.gap),top+row*(ch+st.gap),cw,ch,st)});els.status.textContent=sz.w+' x '+sz.h+'px，'+g.c+' 列 x '+g.r+' 行'+(g.need&&state.images.length!==g.need?'，建议 '+g.need+' 张':'')}function renderThumbs(){els.thumbs.innerHTML='';state.images.forEach((item,i)=>{const row=document.createElement('div');row.className='thumb';row.innerHTML='<img src="'+item.src+'"><div><div class="name">'+esc(item.name)+'</div><div class="size">'+item.width+' x '+item.height+'</div></div><div class="tools"><button class="icon" data-up>↑</button><button class="icon" data-down>↓</button><button class="icon del" data-del>×</button></div>';row.querySelector('[data-up]').onclick=()=>move(i,-1);row.querySelector('[data-down]').onclick=()=>move(i,1);row.querySelector('[data-del]').onclick=()=>{state.images.splice(i,1);render()};els.thumbs.appendChild(row)})}function move(i,d){const j=i+d;if(j<0||j>=state.images.length)return;[state.images[i],state.images[j]]=[state.images[j],state.images[i]];render()}function render(){renderThumbs();draw()}function esc(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function download(){if(!state.images.length)return show('请先添加图片');const a=document.createElement('a');a.download='合集拼图-'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+'.png';a.href=els.canvas.toDataURL('image/png');a.click()}function sample(label,w,h,a,b){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),grad=g.createLinearGradient(0,0,w,h);grad.addColorStop(0,a);grad.addColorStop(1,b);g.fillStyle=grad;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.86)';g.fillRect(w*.12,h*.42,w*.76,h*.16);g.fillStyle='#26231f';g.font='700 '+Math.round(w*.08)+'px Microsoft YaHei';g.textAlign='center';g.textBaseline='middle';g.fillText(label,w/2,h/2);const img=new Image();return new Promise(r=>{img.onload=()=>r({id:uid(),name:label+'.png',src:c.toDataURL(),img,width:w,height:h});img.src=c.toDataURL()})}async function samples(){if(state.images.length)return show('已有图片时不会载入示例');state.images=await Promise.all([sample('第一张',750,1140,'#dff3ff','#8bb8df'),sample('第二张',750,1140,'#fff5e5','#dfb18b'),sample('第三张',900,900,'#e8f5df','#80b38b'),sample('第四张',900,900,'#ffe4e1','#d99a9a')]);render()}els.file.onchange=e=>{addFiles(e.target.files);e.target.value=''};['dragenter','dragover'].forEach(t=>els.drop.addEventListener(t,e=>{e.preventDefault();els.drop.classList.add('over')}));['dragleave','drop'].forEach(t=>els.drop.addEventListener(t,e=>{e.preventDefault();els.drop.classList.remove('over')}));els.drop.ondrop=e=>addFiles(e.dataTransfer.files);document.addEventListener('paste',e=>{const files=[...(e.clipboardData?.files||[])];const items=[...(e.clipboardData?.items||[])].filter(i=>i.kind==='file'&&i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);const imgs=files.length?files:items;if(imgs.length){e.preventDefault();addFiles(imgs)}});[els.layout,els.ratio,els.cols,els.width,els.gap,els.pad,els.radius,els.bg,els.fit].forEach(el=>el.addEventListener('input',e=>{if(e.target===els.layout)setPreset();draw()}));els.download.onclick=download;els.clear.onclick=()=>{if(!state.images.length)return show('现在没有图片需要清空');if(confirm('确定清空当前图片吗？')){state.images=[];render();show('已清空')}};els.sample.onclick=samples;setPreset();render();</script></body></html>
