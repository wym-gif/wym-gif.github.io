row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-bottom:12px}select,input[type=number],input[type=color]{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:7px 10px}input[type=range]{width:100%;accent-color:var(--accent)}input[type=text]{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:7px 10px}.mini-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.anno-active{color:var(--accent);font-weight:700}.thumbs{display:grid;gap:8px;max-height:330px;overflow:auto;padding-right:3px}.thumb{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.thumb img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#eee}.thumb.selected{border-color:var(--accent);background:var(--soft)}.name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.size{color:var(--muted);font-size:12px;margin-top:3px}.tools{display:flex;gap:5px}.icon{width:32px;min-height:32px;border-radius:8px;background:#eee7dc}.del{color:var(--danger)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{min-height:38px;border-radius:8px;background:#eee7dc;color:var(--text);padding:8px 11px}.primary{grid-column:1/-1;background:var(--accent);color:#fff}.stage{min-width:0;display:grid;grid-template-rows:auto 1fr;gap:16px;padding:22px}.preview{min-height:0;display:grid;place-items:center;overflow:auto;padding:18px;background:#e4dccf;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(38,35,31,.08)}canvas{max-width:min(100%,1200px);max-height:78vh;background:#fff;box-shadow:0 10px 28px rgba(38,35,31,.08);cursor:grab;touch-action:none}.mode-tabs{display:none}.mode-tab{min-height:42px;border-radius:8px;background:#eee7dc;color:var(--text);font-weight:700}.mode-tab.active{background:var(--accent);color:#fff}.qr-panel{display:none}.qr-panel.show{display:block}.empty{width:min(680px,100%);padding:38px;border:1px dashed #b8ac9a;border-radius:8px;background:rgba(255,253,248,.7);text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:8px;color:var(--text);font-size:18px}.home-only .app,.link-only .app{grid-template-columns:190px 1fr}.home-only .side,.home-only .preview,.home-only .link-tool,.link-only .side,.link-only .preview,.home-panel,.link-tool{display:none}.home-only .home-panel{display:grid}.link-only .link-tool{display:grid}.link-tool{width:min(1100px,100%);grid-template-rows:auto auto 1fr;gap:14px;align-self:stretch}.link-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.link-title{font-size:22px;font-weight:800}.link-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.link-tab{min-height:40px;border-radius:8px;background:#eee7dc;color:var(--text);font-weight:700}.link-tab.active{background:var(--accent);color:#fff}.link-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}.link-box{display:grid;grid-template-rows:auto 1fr auto;gap:8px;min-height:520px}.link-box textarea{width:100%;height:100%;min-height:420px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:12px;line-height:1.6}.link-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.link-note{color:var(--muted);font-size:13px;line-height:1.5}.home-panel{place-items:center;align-self:stretch}.home-card{width:min(900px,100%);display:grid;gap:18px;text-align:center}.home-card img{width:100%;border-radius:18px;box-shadow:0 18px 45px rgba(38,35,31,.14);background:#f7a477}.home-card h2{font-size:34px;margin:0}.home-card p{margin:0;color:var(--muted);font-size:15px}@media(max-width:900px){.link-grid{grid-template-columns:1fr}.link-box{min-height:360px}.link-box textarea{min-height:280px}}.toast{position:fixed;right:18px;bottom:18px;max-width:320px;padding:12px 14px;border-radius:8px;background:#26231f;color:#fff;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;font-size:14px}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.app,.home-only .app,.link-only .app{grid-template-columns:1fr}.tool-nav{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}.nav-brand{grid-column:1/-1;margin-bottom:0}.side{border-right:0;border-bottom:1px solid var(--line)}canvas{max-height:68vh}}@media(max-width:520px){.side,.stage{padding:16px}.row,.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><nav class="tool-nav"><div class="nav-brand">合集百宝箱</div><button class="nav-btn" id="modeCollage" type="button">拼图</button><button class="nav-btn" id="modeEdit" type="button">P图</button><button class="nav-btn" id="modeLinks" type="button">链接整理</button></nav><aside class="side"><div class="brand"><h1>功能设置</h1><span class="count" id="count">0 张图</span></div><div class="drop" id="drop"><input id="file" type="file" accept="image/*" multiple><div><b>点击或拖入图片</b><p>也可以复制图片后按 Ctrl+V 粘贴进来，只在本机处理。</p></div></div><section class="section"><div class="section-title">功能</div><div class="field"><label for="layout">功能选择</label><select id="layout"><option value="six" data-mode="collage">六宫格正方形</option><option value="four" data-mode="collage">四宫格竖版</option><option value="poster" data-mode="collage">推荐合集海报</option><option value="auto" data-mode="collage">自动网格</option><option value="square" data-mode="collage">九宫格方图</option><option value="vertical" data-mode="collage">竖版长图</option><option value="horizontal" data-mode="collage">横版长图</option><option value="columns" data-mode="collage">固定列数</option><option value="stitchH" data-mode="collage">横向原图拼接</option><option value="stitchV" data-mode="collage">竖向原图拼接</option><option value="qr" data-mode="edit">二维码替换</option></select></div><div class="field"><label for="ratio">画布比例</label><select id="ratio"><option value="auto">按版式自动</option><option value="1:1">1:1 方图</option><option value="3:4">3:4 竖图</option><option value="4:5">4:5 商品图</option><option value="9:16">9:16 手机长图</option><option value="16:9">16:9 横图</option></select></div><div class="row"><label for="cols">列数</label><input id="cols" type="number" min="1" max="8" value="3"></div><div class="row"><label for="width">导出宽度</label><input id="width" type="number" min="200" max="4096" step="10" value="1080"></div></section><section class="section"><div class="section-title">细节</div><div class="field"><label for="gap">图片间距：<span id="gapText">20</span>px</label><input id="gap" type="range" min="0" max="100" value="20"></div><div class="field"><label for="pad">外边距：<span id="padText">30</span>px</label><input id="pad" type="range" min="0" max="160" value="30"></div><div class="row"><label for="radius">圆角</label><input id="radius" type="number" min="0" max="80" value="22"></div><div class="row"><label for="bg">背景色</label><input id="bg" type="color" value="#ffffff"></div><div class="field"><label for="fit">图片填充</label><select id="fit"><option value="cover">等比例铺满，轻微裁切</option><option value="contain">完整留白</option></select></div><div class="qr-panel" id="qrPanel"><div class="section-title">二维码替换</div><div class="field"><label for="qrScale">二维码大小：<span id="qrScaleText">80</span>%</label><input id="qrScale" type="range" min="35" max="160" value="80"></div><div class="field"><label for="qrOpacity">二维码透明度：<span id="qrOpacityText">100</span>%</label><input id="qrOpacity" type="range" min="0" max="100" value="100"></div><div class="field"><label for="qrX">左右位置：<span id="qrXText">0</span></label><input id="qrX" type="range" min="-220" max="220" value="0"></div><div class="field"><label for="qrY">上下位置：<span id="qrYText">0</span></label><input id="qrY" type="range" min="-360" max="360" value="0"></div><div class="row"><label for="badgeText">底部文字</label><input id="badgeText" type="text" placeholder="例如 12"></div><div class="field"><label for="badgeScale">文字大小：<span id="badgeScaleText">100</span>%</label><input id="badgeScale" type="range" min="60" max="160" value="100"></div><div class="field"><label for="badgeOpacity">文字透明度：<span id="badgeOpacityText">100</span>%</label><input id="badgeOpacity" type="range" min="0" max="100" value="100"></div><div class="field"><label for="badgeX">文字左右：<span id="badgeXText">0</span></label><input id="badgeX" type="range" min="-220" max="220" value="0"></div><div class="field"><label for="badgeY">文字上下：<span id="badgeYText">0</span></label><input id="badgeY" type="range" min="-220" max="220" value="0"></div></div><p class="hint">拼图模式用于多图排版；P图模式里，第1张放底图，第2张放新二维码图。</p></section><section class="section"><div class="section-title">单图调整</div><div class="field"><label id="selectedLabel">先点右侧预览图或下方小图</label></div><div class="field"><label for="itemZoom">单图放大：<span id="itemZoomText">100</span>%</label><input id="itemZoom" type="range" min="100" max="240" value="100"></div><div class="field"><label for="itemX">左右移动：<span id="itemXText">0</span></label><input id="itemX" type="range" min="-100" max="100" value="0"></div><div class="field"><label for="itemY">上下移动：<span id="itemYText">0</span></label><input id="itemY" type="range" min="-100" max="100" value="0"></div><button class="btn" id="resetItem" type="button">恢复这张图</button></section><section class="section" id="annoSection"><div class="section-title">标注</div><div class="field"><label id="annoTarget">先点右侧某张图片，再加标注</label></div><div class="mini-actions"><button class="btn" id="addText" type="button">加文字</button><button class="btn" id="addArrow" type="button">加箭头</button><button class="btn" id="addCircle" type="button">加圈圈</button><button class="btn" id="addCross" type="button">加叉号</button></div><div class="field" style="margin-top:12px"><label for="annoText">文字内容</label><input id="annoText" type="text" placeholder="例如 先领券"></div><div class="field"><label for="annoSize">标注大小：<span id="annoSizeText">48</span></label><input id="annoSize" type="range" min="16" max="180" value="48"></div><div class="row"><label for="annoColor">标注颜色</label><input id="annoColor" type="color" value="#18bff2"></div><div class="field"><label for="annoOpacity">标注透明度：<span id="annoOpacityText">100</span>%</label><input id="annoOpacity" type="range" min="0" max="100" value="100"></div><button class="btn" id="deleteAnno" type="button">删除当前标注</button></section><section class="section"><div class="section-title">图片顺序</div><div class="thumbs" id="thumbs"></div></section><div class="actions"><button class="btn primary" id="download" type="button">导出 PNG</button><button class="btn" id="clear" type="button">清空图片</button><button class="btn" id="sample" type="button">示例图</button></div></aside><section class="stage"><div class="hint" id="status">请选择左侧功能入口。</div><div class="home-panel" id="homePanel"><div class="home-card"><img id="homeImage" alt="豆妈合集" src=""><h2>合集百宝箱</h2><p>左侧选择拼图、P图或链接整理。</p></div></div><div class="preview"><div class="empty" id="empty"><strong id="emptyTitle">把图片放进来就能拼</strong><span id="emptyHint">支持宫格、长图、固定列数，也支持海报和原图拼接。</span></div><canvas id="canvas" hidden></canvas></div><div class="link-tool" id="linkTool" hidden><div class="link-head"><div><div class="link-title">链接整理</div><div class="link-note" id="linkRuleHint">满分号群发：最后一个链接对应的产品放第一。</div></div></div><div class="link-tabs"><button class="link-tab active" id="linkMass" type="button">满分号群发</button><button class="link-tab" id="linkCollection" type="button">合集</button></div><div class="link-grid"><div class="link-box"><label for="linkInput">粘贴原文</label><textarea id="linkInput" placeholder="把大合集原文粘贴到这里"></textarea><div class="link-actions"><button class="btn primary" id="linkFormat" type="button">整理</button><button class="btn" id="linkClear" type="button">清空</button></div></div><div class="link-box"><label for="linkOutput">整理结果</label><textarea id="linkOutput" readonly placeholder="整理后的内容会显示在这里"></textarea><div class="link-actions"><button class=
