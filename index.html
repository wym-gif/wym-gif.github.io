<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>合集拼图工具</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --text: #26231f;
      --muted: #756f66;
      --line: #d9d1c4;
      --accent: #1d7a73;
      --accent-strong: #155f5a;
      --soft: #e8f2ef;
      --danger: #a63c2f;
      --shadow: 0 10px 28px rgba(38, 35, 31, .08);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 360px 1fr;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 22px;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .dropzone {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 150px;
      padding: 18px;
      border: 2px dashed #b7ab99;
      border-radius: 8px;
      background: #faf7f0;
      text-align: center;
      transition: border-color .2s ease, background .2s ease;
    }

    .dropzone.is-over {
      border-color: var(--accent);
      background: var(--soft);
    }

    .dropzone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-title {
      margin: 0 0 8px;
      font-weight: 700;
    }

    .drop-sub {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 12px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
    }

    select,
    input[type="number"],
    input[type="text"],
    input[type="color"] {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 7px 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .seg {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .seg button,
    .btn,
    .icon-btn {
      min-height: 38px;
      border-radius: 8px;
      background: #eee7dc;
      color: var(--text);
      padding: 8px 11px;
      transition: background .15s ease, color .15s ease, transform .15s ease;
    }

    .seg button[aria-pressed="true"],
    .btn.primary {
      background: var(--accent);
      color: #fff;
    }

    .seg button:hover,
    .btn:hover,
    .icon-btn:hover {
      transform: translateY(-1px);
    }

    .btn.primary:hover {
      background: var(--accent-strong);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .actions .primary {
      grid-column: 1 / -1;
    }

    .thumb-list {
      display: grid;
      gap: 8px;
      max-height: 310px;
      overflow: auto;
      padding-right: 3px;
    }

    .thumb {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .thumb.is-selected {
      border-color: var(--accent);
      background: var(--soft);
    }

    .thumb.dragging {
      opacity: .55;
    }

    .thumb img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
    }

    .thumb-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    .thumb-size {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .thumb-tools {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 32px;
      min-height: 32px;
      padding: 0;
      font-size: 15px;
    }

    .remove {
      color: var(--danger);
    }

    .adjust-empty {
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .mini-action {
      width: 100%;
      margin-top: 2px;
    }

    .stage {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 22px;
      gap: 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .canvas-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 18px;
      background: #e6ded2;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(38, 35, 31, .08);
    }

    canvas {
      max-width: min(100%, 1100px);
      max-height: 78vh;
      width: auto;
      height: auto;
      background: #fff;
      box-shadow: var(--shadow);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    canvas.is-dragging {
      cursor: grabbing;
    }

    .empty {
      width: min(680px, 100%);
      padding: 38px;
      border: 1px dashed #b7ab99;
      border-radius: 8px;
      background: rgba(255, 253, 248, .68);
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 18px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: 320px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #26231f;
      color: #fff;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      canvas {
        max-height: 68vh;
      }
    }

    @media (max-width: 520px) {
      .sidebar,
      .stage {
        padding: 16px;
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .seg {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>合集拼图工具</h1>
        <span class="count" id="imageCount">0 张图</span>
      </div>

      <div class="dropzone" id="dropzone">
        <input id="fileInput" type="file" accept="image/*" multiple>
        <div>
          <p class="drop-title">点击或拖入图片</p>
          <p class="drop-sub">也可以复制图片后按 Ctrl+V 粘贴进来，图片只在本机处理。</p>
        </div>
      </div>

      <section class="section">
        <div class="section-title">版式</div>
        <div class="field">
          <label for="layout">拼图方式</label>
          <select id="layout">
            <option value="six-square">六宫格正方形</option>
            <option value="four-vertical">四宫格竖版</option>
            <option value="auto">自动网格</option>
            <option value="square">九宫格方图</option>
            <option value="vertical">竖版长图</option>
            <option value="horizontal">横版长图</option>
            <option value="columns">固定列数</option>
          </select>
        </div>

        <div class="field">
          <label for="ratio">画布比例</label>
          <select id="ratio">
            <option value="auto">按版式自动</option>
            <option value="1:1">1:1 方图</option>
            <option value="3:4">3:4 竖图</option>
            <option value="4:5">4:5 商品图</option>
            <option value="9:16">9:16 手机长图</option>
            <option value="16:9">16:9 横图</option>
          </select>
        </div>

        <div class="field-row">
          <label for="columns">列数</label>
          <input id="columns" type="number" min="1" max="8" value="3">
        </div>

        <div class="field-row">
          <label for="canvasWidth">导出宽度</label>
          <input id="canvasWidth" type="number" min="360" max="4096" step="10" value="1080">
        </div>
      </section>

      <section class="section">
        <div class="section-title">细节</div>
        <div class="field">
          <label for="gap">图片间距：<span id="gapValue">18</span>px</label>
          <input id="gap" type="range" min="0" max="80" value="18">
        </div>
        <div class="field">
          <label for="padding">外边距：<span id="paddingValue">28</span>px</label>
          <input id="padding" type="range" min="0" max="120" value="28">
        </div>
        <div class="field-row">
          <label for="radius">圆角</label>
          <input id="radius" type="number" min="0" max="80" value="0">
        </div>
        <div class="field-row">
          <label for="bgColor">背景色</label>
          <input id="bgColor" type="color" value="#ffffff">
        </div>
        <div class="field">
          <label for="fitMode">图片填充</label>
          <select id="fitMode">
            <option value="cover">等比例铺满，轻微裁切</option>
            <option value="contain">完整留白</option>
          </select>
        </div>
        <div class="field">
          <label for="dragMode">右侧拖动</label>
          <select id="dragMode">
            <option value="reorder">换图片位置</option>
            <option value="crop">调整图片内容</option>
          </select>
        </div>
      </section>

      <section class="section">
        <div class="section-title">
          <span>单图调整</span>
          <span class="count" id="selectedLabel">未选中</span>
        </div>
        <div id="adjustEmpty" class="adjust-empty">点击左侧图片可调整主体；右侧预览可拖动换位置或调整图片内容。</div>
        <div id="adjustControls" hidden>
          <div class="field">
            <label for="zoom">放大：<span id="zoomValue">100</span>%</label>
            <input id="zoom" type="range" min="100" max="180" value="100">
          </div>
          <div class="field">
            <label for="offsetX">左右移动：<span id="offsetXValue">0</span></label>
            <input id="offsetX" type="range" min="-100" max="100" value="0">
          </div>
          <div class="field">
            <label for="offsetY">上下移动：<span id="offsetYValue">0</span></label>
            <input id="offsetY" type="range" min="-100" max="100" value="0">
          </div>
          <button class="btn mini-action" id="resetAdjustBtn" type="button">恢复这张图</button>
        </div>
      </section>

      <section class="section">
        <div class="section-title">图片顺序</div>
        <div class="thumb-list" id="thumbList"></div>
      </section>

      <div class="actions">
        <button class="btn primary" id="downloadBtn" type="button">导出 PNG</button>
        <button class="btn" id="clearBtn" type="button">清空图片</button>
        <button class="btn" id="sampleBtn" type="button">示例图</button>
      </div>
    </aside>

    <section class="stage">
      <div class="topbar">
        <div class="status" id="statusText">先添加图片，右侧会自动生成预览。</div>
        <div class="seg" aria-label="快速版式">
          <button type="button" data-layout-pick="six-square" aria-pressed="true">六宫格</button>
          <button type="button" data-layout-pick="four-vertical" aria-pressed="false">四宫格</button>
        </div>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="empty" id="emptyState">
          <strong>把图片放进来就能拼</strong>
          支持多选、复制粘贴、拖动换位置，再一键导出。
        </div>
        <canvas id="canvas" hidden></canvas>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const state = {
      images: [],
      draggingId: null,
      selectedId: null,
      cellRects: [],
      dragReorder: null,
      dragCrop: null,
      hoverCellId: null
    };

    const els = {
      fileInput: document.getElementById("fileInput"),
      dropzone: document.getElementById("dropzone"),
      imageCount: document.getElementById("imageCount"),
      layout: document.getElementById("layout"),
      ratio: document.getElementById("ratio"),
      columns: document.getElementById("columns"),
      canvasWidth: document.getElementById("canvasWidth"),
      gap: document.getElementById("gap"),
      gapValue: document.getElementById("gapValue"),
      padding: document.getElementById("padding"),
      paddingValue: document.getElementById("paddingValue"),
      radius: document.getElementById("radius"),
      bgColor: document.getElementById("bgColor"),
      fitMode: document.getElementById("fitMode"),
      selectedLabel: document.getElementById("selectedLabel"),
      adjustEmpty: document.getElementById("adjustEmpty"),
      adjustControls: document.getElementById("adjustControls"),
      dragMode: document.getElementById("dragMode"),
      zoom: document.getElementById("zoom"),
      zoomValue: document.getElementById("zoomValue"),
      offsetX: document.getElementById("offsetX"),
      offsetXValue: document.getElementById("offsetXValue"),
      offsetY: document.getElementById("offsetY"),
      offsetYValue: document.getElementById("offsetYValue"),
      resetAdjustBtn: document.getElementById("resetAdjustBtn"),
      thumbList: document.getElementById("thumbList"),
      canvas: document.getElementById("canvas"),
      emptyState: document.getElementById("emptyState"),
      statusText: document.getElementById("statusText"),
      downloadBtn: document.getElementById("downloadBtn"),
      clearBtn: document.getElementById("clearBtn"),
      sampleBtn: document.getElementById("sampleBtn"),
      toast: document.getElementById("toast")
    };

    const ctx = els.canvas.getContext("2d");

    const layoutPresets = {
      "six-square": {
        ratio: "1:1",
        columns: 3,
        gap: 20,
        padding: 30,
        radius: 22,
        fitMode: "cover",
        bgColor: "#ffffff"
      },
      "four-vertical": {
        ratio: "3:4",
        columns: 2,
        gap: 12,
        padding: 20,
        radius: 26,
        fitMode: "cover",
        bgColor: "#ffffff"
      }
    };

    function uid() {
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function showToast(text) {
      els.toast.textContent = text;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function parseRatio(value) {
      if (value === "auto") return null;
      const [w, h] = value.split(":").map(Number);
      return h / w;
    }

    function getSettings() {
      return {
        layout: els.layout.value,
        ratio: els.ratio.value,
        columns: clamp(Number(els.columns.value) || 3, 1, 8),
        width: clamp(Number(els.canvasWidth.value) || 1080, 360, 4096),
        gap: Number(els.gap.value),
        padding: Number(els.padding.value),
        radius: clamp(Number(els.radius.value) || 0, 0, 80),
        bgColor: els.bgColor.value,
        fitMode: els.fitMode.value
      };
    }

    function imageFromFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve({
            id: uid(),
            name: file.name || `粘贴图片-${state.images.length + 1}.png`,
            src: reader.result,
            img,
            width: img.naturalWidth,
            height: img.naturalHeight,
            adjust: { zoom: 1, offsetX: 0, offsetY: 0 }
          });
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function addFiles(files) {
      const list = Array.from(files).filter(file => file.type.startsWith("image/"));
      if (!list.length) return;
      try {
        const loaded = await Promise.all(list.map(imageFromFile));
        state.images.push(...loaded);
        if (!state.selectedId && loaded.length) {
          state.selectedId = loaded[0].id;
        }
        renderAll();
        showToast(`已添加 ${loaded.length} 张图片`);
      } catch (error) {
        showToast("有图片读取失败，请换一张试试");
      }
    }

    function applyLayoutPreset(value) {
      const preset = layoutPresets[value];
      if (!preset) return;
      els.ratio.value = preset.ratio;
      els.columns.value = preset.columns;
      els.gap.value = preset.gap;
      els.padding.value = preset.padding;
      els.radius.value = preset.radius;
      els.fitMode.value = preset.fitMode;
      els.bgColor.value = preset.bgColor;
    }

    function setLayout(value) {
      els.layout.value = value;
      applyLayoutPreset(value);
      document.querySelectorAll("[data-layout-pick]").forEach(btn => {
        btn.setAttribute("aria-pressed", btn.dataset.layoutPick === value ? "true" : "false");
      });
      renderAll();
    }

    function getGrid(count, settings) {
      if (settings.layout === "six-square") return { cols: 3, rows: 2, limit: 6, expected: 6 };
      if (settings.layout === "four-vertical") return { cols: 2, rows: 2, limit: 4, expected: 4 };
      if (settings.layout === "vertical") return { cols: 1, rows: count };
      if (settings.layout === "horizontal") return { cols: count, rows: 1 };
      if (settings.layout === "columns") {
        const cols = Math.min(settings.columns, Math.max(count, 1));
        return { cols, rows: Math.ceil(count / cols) };
      }
      if (settings.layout === "square") {
        const cols = Math.ceil(Math.sqrt(count || 1));
        return { cols, rows: cols };
      }
      const cols = Math.ceil(Math.sqrt(count || 1));
      return { cols, rows: Math.ceil((count || 1) / cols) };
    }

    function getCanvasSize(count, settings, grid) {
      const width = settings.width;
      const ratio = parseRatio(settings.ratio);
      if (ratio) return { width, height: Math.round(width * ratio) };
      if (settings.layout === "vertical") {
        const cellW = width - settings.padding * 2;
        const avgRatio = averageRatio();
        return { width, height: Math.round(settings.padding * 2 + count * cellW * avgRatio + settings.gap * Math.max(0, count - 1)) };
      }
      if (settings.layout === "horizontal") {
        return { width, height: Math.round(width / Math.max(grid.cols, 1) + settings.padding * 2) };
      }
      return { width, height: width };
    }

    function averageRatio() {
      if (!state.images.length) return 1;
      const sum = state.images.reduce((total, item) => total + item.height / item.width, 0);
      return clamp(sum / state.images.length, .6, 1.8);
    }

    function roundedClip(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawFittedImage(item, x, y, w, h, settings) {
      const imgRatio = item.width / item.height;
      const boxRatio = w / h;
      const adjust = item.adjust || { zoom: 1, offsetX: 0, offsetY: 0 };
      let dx = x;
      let dy = y;
      let dw = w;
      let dh = h;

      if (settings.fitMode === "cover") {
        const baseScale = Math.max(w / item.width, h / item.height);
        const scale = baseScale * (adjust.zoom || 1);
        dw = item.width * scale;
        dh = item.height * scale;
        const maxShiftX = Math.max(0, (dw - w) / 2);
        const maxShiftY = Math.max(0, (dh - h) / 2);
        dx = x + (w - dw) / 2 + maxShiftX * (adjust.offsetX || 0);
        dy = y + (h - dh) / 2 + maxShiftY * (adjust.offsetY || 0);
      } else if (imgRatio > boxRatio) {
        dh = w / imgRatio;
        dy = y + (h - dh) / 2;
      } else {
        dw = h * imgRatio;
        dx = x + (w - dw) / 2;
      }

      ctx.save();
      roundedClip(x, y, w, h, settings.radius);
      ctx.clip();
      ctx.fillStyle = "#f3f0ea";
      ctx.fillRect(x, y, w, h);
      ctx.drawImage(item.img, dx, dy, dw, dh);
      ctx.restore();
    }

    function getCanvasPoint(event) {
      const box = els.canvas.getBoundingClientRect();
      return {
        x: (event.clientX - box.left) * (els.canvas.width / box.width),
        y: (event.clientY - box.top) * (els.canvas.height / box.height)
      };
    }

    function hitTestCanvas(point) {
      return state.cellRects.find(rect =>
        point.x >= rect.x && point.x <= rect.x + rect.w &&
        point.y >= rect.y && point.y <= rect.y + rect.h
      );
    }

    function swapImagesById(fromId, toId) {
      const from = state.images.findIndex(item => item.id === fromId);
      const to = state.images.findIndex(item => item.id === toId);
      if (from < 0 || to < 0 || from === to) return false;
      [state.images[from], state.images[to]] = [state.images[to], state.images[from]];
      return true;
    }

    function getShiftLimit(item, rect) {
      const adjust = item.adjust || { zoom: 1, offsetX: 0, offsetY: 0 };
      const scale = Math.max(rect.w / item.width, rect.h / item.height) * (adjust.zoom || 1);
      return {
        x: Math.max(0, (item.width * scale - rect.w) / 2),
        y: Math.max(0, (item.height * scale - rect.h) / 2)
      };
    }

    function drawCanvas(showSelection = true) {
      const settings = getSettings();
      const count = state.images.length;
      state.cellRects = [];
      els.canvas.hidden = count === 0;
      els.emptyState.hidden = count > 0;
      els.imageCount.textContent = `${count} 张图`;

      if (!count) {
        els.statusText.textContent = "先添加图片，右侧会自动生成预览。";
        return;
      }

      const grid = getGrid(count, settings);
      const size = getCanvasSize(count, settings, grid);
      els.canvas.width = size.width;
      els.canvas.height = size.height;

      ctx.fillStyle = settings.bgColor;
      ctx.fillRect(0, 0, size.width, size.height);

      const innerW = size.width - settings.padding * 2;
      const innerH = size.height - settings.padding * 2;
      const cellW = (innerW - settings.gap * (grid.cols - 1)) / grid.cols;
      const cellH = (innerH - settings.gap * (grid.rows - 1)) / grid.rows;

      state.images.forEach((item, index) => {
        if (grid.limit && index >= grid.limit) return;
        const col = index % grid.cols;
        const row = Math.floor(index / grid.cols);
        if (row >= grid.rows) return;
        const x = settings.padding + col * (cellW + settings.gap);
        const y = settings.padding + row * (cellH + settings.gap);
        drawFittedImage(item, x, y, cellW, cellH, settings);
        state.cellRects.push({ id: item.id, x, y, w: cellW, h: cellH });
      });

      if (showSelection && state.selectedId) {
        const selectedRect = state.cellRects.find(rect => rect.id === state.selectedId);
        if (selectedRect) {
          ctx.save();
          ctx.strokeStyle = "#1d7a73";
          ctx.lineWidth = Math.max(4, Math.round(size.width / 240));
          roundedClip(selectedRect.x, selectedRect.y, selectedRect.w, selectedRect.h, settings.radius);
          ctx.stroke();
          ctx.restore();
        }
      }

      if (showSelection && state.dragReorder && state.hoverCellId && state.hoverCellId !== state.dragReorder.id) {
        const hoverRect = state.cellRects.find(rect => rect.id === state.hoverCellId);
        if (hoverRect) {
          ctx.save();
          ctx.strokeStyle = "#d95d39";
          ctx.lineWidth = Math.max(5, Math.round(size.width / 210));
          roundedClip(hoverRect.x, hoverRect.y, hoverRect.w, hoverRect.h, settings.radius);
          ctx.stroke();
          ctx.restore();
        }
      }

      const usedCount = grid.limit ? Math.min(count, grid.limit) : count;
      const expectedText = grid.expected && count !== grid.expected
        ? `，建议放 ${grid.expected} 张，当前使用前 ${usedCount} 张`
        : "";
      els.statusText.textContent = `${size.width} x ${size.height}px，${grid.cols} 列 x ${grid.rows} 行${expectedText}`;
    }

    function renderThumbs() {
      els.thumbList.innerHTML = "";
      state.images.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = `thumb${item.id === state.selectedId ? " is-selected" : ""}`;
        row.draggable = true;
        row.dataset.id = item.id;
        row.innerHTML = `
          <img src="${item.src}" alt="">
          <div>
            <div class="thumb-name">${escapeHtml(item.name)}</div>
            <div class="thumb-size">${item.width} x ${item.height}</div>
          </div>
          <div class="thumb-tools">
            <button class="icon-btn" type="button" data-move="-1" aria-label="上移">↑</button>
            <button class="icon-btn" type="button" data-move="1" aria-label="下移">↓</button>
            <button class="icon-btn remove" type="button" data-remove aria-label="删除">×</button>
          </div>
        `;

        row.addEventListener("click", event => {
          if (event.target.closest("button")) return;
          selectImage(item.id);
        });

        row.addEventListener("dragstart", () => {
          state.draggingId = item.id;
          row.classList.add("dragging");
        });
        row.addEventListener("dragend", () => {
          state.draggingId = null;
          row.classList.remove("dragging");
        });
        row.addEventListener("dragover", event => {
          event.preventDefault();
          const from = state.images.findIndex(img => img.id === state.draggingId);
          const to = state.images.findIndex(img => img.id === item.id);
          if (from < 0 || to < 0 || from === to) return;
          const [moved] = state.images.splice(from, 1);
          state.images.splice(to, 0, moved);
          renderAll();
        });

        row.querySelector("[data-remove]").addEventListener("click", () => {
          state.images = state.images.filter(img => img.id !== item.id);
          if (state.selectedId === item.id) {
            state.selectedId = state.images[0]?.id || null;
          }
          renderAll();
        });

        row.querySelectorAll("[data-move]").forEach(button => {
          button.addEventListener("click", () => {
            const direction = Number(button.dataset.move);
            const target = index + direction;
            if (target < 0 || target >= state.images.length) return;
            const [moved] = state.images.splice(index, 1);
            state.images.splice(target, 0, moved);
            renderAll();
          });
        });

        els.thumbList.appendChild(row);
      });
    }

    function getSelectedImage() {
      return state.images.find(item => item.id === state.selectedId) || null;
    }

    function selectImage(id) {
      state.selectedId = id;
      renderAll();
    }

    function selectImageQuiet(id) {
      state.selectedId = id;
      renderThumbs();
      drawCanvas();
      updateAdjustPanel();
    }

    function updateAdjustPanel() {
      const selected = getSelectedImage();
      const hasSelected = Boolean(selected);
      els.adjustEmpty.hidden = hasSelected;
      els.adjustControls.hidden = !hasSelected;
      els.selectedLabel.textContent = hasSelected ? selected.name : "未选中";
      if (!hasSelected) return;

      selected.adjust ||= { zoom: 1, offsetX: 0, offsetY: 0 };
      const zoom = Math.round(selected.adjust.zoom * 100);
      const offsetX = Math.round(selected.adjust.offsetX * 100);
      const offsetY = Math.round(selected.adjust.offsetY * 100);
      els.zoom.value = zoom;
      els.zoomValue.textContent = zoom;
      els.offsetX.value = offsetX;
      els.offsetXValue.textContent = offsetX;
      els.offsetY.value = offsetY;
      els.offsetYValue.textContent = offsetY;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderAll() {
      els.gapValue.textContent = els.gap.value;
      els.paddingValue.textContent = els.padding.value;
      els.columns.disabled = els.layout.value !== "columns";
      document.querySelectorAll("[data-layout-pick]").forEach(btn => {
        btn.setAttribute("aria-pressed", btn.dataset.layoutPick === els.layout.value ? "true" : "false");
      });
      renderThumbs();
      drawCanvas();
      updateAdjustPanel();
    }

    function downloadCanvas() {
      if (!state.images.length) {
        showToast("请先添加图片");
        return;
      }
      const link = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
      link.download = `合集拼图-${stamp}.png`;
      drawCanvas(false);
      link.href = els.canvas.toDataURL("image/png");
      link.click();
      drawCanvas(true);
    }

    function makeSampleImage(label, colorA, colorB) {
      const sample = document.createElement("canvas");
      sample.width = 900;
      sample.height = 900;
      const c = sample.getContext("2d");
      const gradient = c.createLinearGradient(0, 0, 900, 900);
      gradient.addColorStop(0, colorA);
      gradient.addColorStop(1, colorB);
      c.fillStyle = gradient;
      c.fillRect(0, 0, 900, 900);
      c.fillStyle = "rgba(255,255,255,.82)";
      c.fillRect(96, 620, 708, 112);
      c.fillStyle = "#26231f";
      c.font = "700 64px Microsoft YaHei, sans-serif";
      c.textAlign = "center";
      c.fillText(label, 450, 695);

      const img = new Image();
      return new Promise(resolve => {
        img.onload = () => resolve({
          id: uid(),
          name: `${label}.png`,
          src: sample.toDataURL("image/png"),
          img,
          width: 900,
          height: 900,
          adjust: { zoom: 1, offsetX: 0, offsetY: 0 }
        });
        img.src = sample.toDataURL("image/png");
      });
    }

    async function loadSamples() {
      if (state.images.length) {
        showToast("已有图片时不会载入示例，避免覆盖你的图片");
        return;
      }
      state.images = await Promise.all([
        makeSampleImage("主图", "#f2c078", "#d95d39"),
        makeSampleImage("细节", "#84a59d", "#2b6f6d"),
        makeSampleImage("颜色", "#f28482", "#7d4f50"),
        makeSampleImage("尺寸", "#90be6d", "#277da1"),
        makeSampleImage("包装", "#f6bd60", "#8d6a9f"),
        makeSampleImage("场景", "#b8c0ff", "#5e548e")
      ]);
      state.selectedId = state.images[0]?.id || null;
      renderAll();
      showToast("已载入示例图");
    }

    els.fileInput.addEventListener("change", event => {
      addFiles(event.target.files);
      event.target.value = "";
    });

    ["dragenter", "dragover"].forEach(type => {
      els.dropzone.addEventListener(type, event => {
        event.preventDefault();
        els.dropzone.classList.add("is-over");
      });
    });

    ["dragleave", "drop"].forEach(type => {
      els.dropzone.addEventListener(type, event => {
        event.preventDefault();
        els.dropzone.classList.remove("is-over");
      });
    });

    els.dropzone.addEventListener("drop", event => addFiles(event.dataTransfer.files));

    document.addEventListener("paste", event => {
      const files = Array.from(event.clipboardData?.files || []);
      const itemFiles = Array.from(event.clipboardData?.items || [])
        .filter(item => item.kind === "file" && item.type.startsWith("image/"))
        .map(item => item.getAsFile())
        .filter(Boolean);
      const images = files.length ? files : itemFiles;
      if (!images.length) return;
      event.preventDefault();
      addFiles(images);
    });

    els.canvas.addEventListener("pointerdown", event => {
      const point = getCanvasPoint(event);
      const hit = hitTestCanvas(point);
      if (!hit) return;
      const item = state.images.find(image => image.id === hit.id);
      if (!item) return;
      item.adjust ||= { zoom: 1, offsetX: 0, offsetY: 0 };
      selectImageQuiet(hit.id);

      if (els.dragMode.value === "crop") {
        state.dragCrop = {
          id: hit.id,
          startX: point.x,
          startY: point.y,
          startOffsetX: item.adjust.offsetX || 0,
          startOffsetY: item.adjust.offsetY || 0
        };
        els.canvas.classList.add("is-dragging");
        els.canvas.setPointerCapture(event.pointerId);
        return;
      }

      state.dragReorder = {
        id: hit.id,
        startX: point.x,
        startY: point.y,
        moved: false
      };
      state.hoverCellId = hit.id;
      els.canvas.classList.add("is-dragging");
      els.canvas.setPointerCapture(event.pointerId);
    });

    els.canvas.addEventListener("pointermove", event => {
      if (state.dragCrop) {
        const item = state.images.find(image => image.id === state.dragCrop.id);
        const rect = state.cellRects.find(cell => cell.id === state.dragCrop.id);
        if (!item || !rect) return;
        const point = getCanvasPoint(event);
        const limit = getShiftLimit(item, rect);
        item.adjust ||= { zoom: 1, offsetX: 0, offsetY: 0 };
        if (limit.x > 0) {
          item.adjust.offsetX = clamp(state.dragCrop.startOffsetX + (point.x - state.dragCrop.startX) / limit.x, -1, 1);
        }
        if (limit.y > 0) {
          item.adjust.offsetY = clamp(state.dragCrop.startOffsetY + (point.y - state.dragCrop.startY) / limit.y, -1, 1);
        }
        drawCanvas();
        updateAdjustPanel();
        return;
      }

      if (!state.dragReorder) return;
      const point = getCanvasPoint(event);
      const distance = Math.hypot(point.x - state.dragReorder.startX, point.y - state.dragReorder.startY);
      if (distance > 10) {
        state.dragReorder.moved = true;
      }
      const hit = hitTestCanvas(point);
      state.hoverCellId = hit?.id || null;
      drawCanvas();
    });

    ["pointerup", "pointercancel"].forEach(type => {
      els.canvas.addEventListener(type, event => {
        if (state.dragCrop) {
          state.dragCrop = null;
          els.canvas.classList.remove("is-dragging");
          if (els.canvas.hasPointerCapture?.(event.pointerId)) {
            els.canvas.releasePointerCapture(event.pointerId);
          }
          drawCanvas();
          updateAdjustPanel();
          return;
        }

        if (!state.dragReorder) return;
        const drag = state.dragReorder;
        const point = getCanvasPoint(event);
        const hit = hitTestCanvas(point);
        state.dragReorder = null;
        state.hoverCellId = null;
        els.canvas.classList.remove("is-dragging");
        if (els.canvas.hasPointerCapture?.(event.pointerId)) {
          els.canvas.releasePointerCapture(event.pointerId);
        }
        if (type === "pointerup" && drag.moved && hit && hit.id !== drag.id) {
          swapImagesById(drag.id, hit.id);
          state.selectedId = drag.id;
          renderAll();
          showToast("已交换位置");
          return;
        }
        renderAll();
      });
    });

    [
      els.layout,
      els.ratio,
      els.columns,
      els.canvasWidth,
      els.gap,
      els.padding,
      els.radius,
      els.bgColor,
      els.fitMode
    ].forEach(control => control.addEventListener("input", event => {
      if (event.currentTarget === els.layout) {
        applyLayoutPreset(els.layout.value);
      }
      renderAll();
    }));

    document.querySelectorAll("[data-layout-pick]").forEach(button => {
      button.addEventListener("click", () => setLayout(button.dataset.layoutPick));
    });

    [els.zoom, els.offsetX, els.offsetY].forEach(control => {
      control.addEventListener("input", () => {
        const selected = getSelectedImage();
        if (!selected) return;
        selected.adjust ||= { zoom: 1, offsetX: 0, offsetY: 0 };
        selected.adjust.zoom = Number(els.zoom.value) / 100;
        selected.adjust.offsetX = Number(els.offsetX.value) / 100;
        selected.adjust.offsetY = Number(els.offsetY.value) / 100;
        drawCanvas();
        updateAdjustPanel();
      });
    });

    els.resetAdjustBtn.addEventListener("click", () => {
      const selected = getSelectedImage();
      if (!selected) return;
      selected.adjust = { zoom: 1, offsetX: 0, offsetY: 0 };
      renderAll();
      showToast("已恢复这张图");
    });

    els.downloadBtn.addEventListener("click", downloadCanvas);
    els.clearBtn.addEventListener("click", () => {
      if (!state.images.length) {
        showToast("现在没有图片需要清空");
        return;
      }
      if (!window.confirm("确定要清空当前图片吗？清空后需要重新选择图片。")) {
        return;
      }
      state.images = [];
      state.selectedId = null;
      renderAll();
      showToast("已清空");
    });
    els.sampleBtn.addEventListener("click", loadSamples);

    applyLayoutPreset(els.layout.value);
    renderAll();
  </script>
</body>
</html>
